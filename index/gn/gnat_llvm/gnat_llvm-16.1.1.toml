name = "gnat_llvm"
version = "16.1.1"
provides = ["gnat=16.1.1"]
description = "GNAT-LLVM Ada compiler with WebAssembly and native runtimes"
long-description = """
GNAT-LLVM (GCC 16.1.1 front end, LLVM 21 back end) with prebuilt runtimes:

- wasm32: rts-wasm, rts-wasm-eh, rts-wasm-emcc, rts-wasm-emcc-eh,
  rts-wasm-wasi-eh (and -exnref variants of the EH runtimes)
- native: rts-native

Projects use `for Target use "llvm";` and select a runtime with
`for Runtime ("Ada") use external ("GNAT_LLVM_PREFIX") & "/lib/gnat-llvm/wasm32/rts-wasm-eh";`
"""
maintainers = ["Aldo Nicolas Bruno <ovenpasta@pizzahack.eu>"]
maintainers-logins = ["ovenpasta"]
licenses = "GPL-3.0-or-later AND GPL-3.0-or-later WITH GCC-exception-3.1"
website = "https://github.com/ovenpasta/gnat-llvm"

auto-gpr-with = false

[configuration]
disabled = true

[environment]
PATH.prepend = "${CRATE_ROOT}/bin"
GNAT_LLVM_PREFIX.set = "${CRATE_ROOT}"

[origin."case(os)".linux."case(host-arch)".aarch64]
binary = true
url = "https://github.com/ovenpasta/gnat-llvm/releases/download/v16.1.1/gnat_llvm-16.1.1-aarch64-linux.tar.gz"
hashes = ["sha256:64deaf23d8b018c516f6e8f0bcee08bf79eb568ba7add64f48b6233dfdf2517c"]

[origin."case(os)".linux."case(host-arch)".x86-64]
binary = true
url = "https://github.com/ovenpasta/gnat-llvm/releases/download/v16.1.1/gnat_llvm-16.1.1-x86_64-linux.tar.gz"
hashes = ["sha256:e056431ade9ad45a04118fcc621d5ba71dd1d935662379aa7a66d07fd0c76181"]
